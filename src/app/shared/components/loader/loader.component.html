@if (error$ | async; as error) {
    <div class="-s">
        <p>{{ error }}</p>
        <button class="retry-button" (click)="refresh()">Повторить</button>
    </div>
} @else if (loading$ | async) {
    <div class="loading">
        <div class="spinner"></div>
        <p>Загрузка данных...</p>
    </div>
} @else {
    <ng-content></ng-content>
}
