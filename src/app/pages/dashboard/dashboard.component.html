<div class="dashboard-container">
    <div class="dashboard-header">
        <h1>Дашборд событий</h1>
        <p>Управление и просмотр временных событий</p>
    </div>

    <div class="dashboard-content">
        <div class="card">
            <h2>Таймлайн событий</h2>
            <p>Просмотрите все события на интерактивном таймлайне</p>
            <button class="primary-button" (click)="navigateToTimeline()">
                Перейти к таймлайну
            </button>
        </div>

        <div class="card">
            <h2>Статистика</h2>
            <p>Здесь может быть ваша статистика и аналитика</p>
        </div>
    </div>
</div>
